name: Release

# Publishing a tag like v0.2.0 (matching package.json "version") builds, tests,
# and publishes a GitHub Release with the built site attached.
on:
  push:
    tags: ['v*.*.*']

# Required to create the release. Kept at the job level; every other scope is
# left at none. Note: if this fails with a 403, check
# Settings -> Actions -> General -> Workflow permissions.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 matches compose.yaml (node:22-alpine) and @types/node ^22.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast: never publish a tag that disagrees with package.json.
      - name: Verify tag matches package.json version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi
          echo "Releasing version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Same suite CI runs on main; a tag can point at any commit, so re-verify.
      # This also produces dist/ via the build step.
      - name: Run full test suite
        run: npm run check

      - name: Package build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          archive="qr-private-studio-${{ steps.version.outputs.version }}.zip"
          (cd dist && zip -r "../$archive" .)
          ls -lh "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        id: package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            --title "QR Private Studio ${{ steps.version.outputs.version }}" \
            --generate-notes
